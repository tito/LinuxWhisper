[project]
name = "linuxwhisper"
version = "1.0.0"
description = "Voice Assistant for Linux - Voice-to-text and AI assistant tool using OpenAI-compatible APIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "sounddevice",
    "numpy",
    "scipy",
    "openai",
    "python-dotenv",
    "pygobject",
    "pycairo",
    "structlog>=25.5.0",
]

[project.scripts]
linuxwhisper = "linuxwhisper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
